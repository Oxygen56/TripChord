services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tripchord
      POSTGRES_USER: tripchord
      POSTGRES_PASSWORD: tripchord
    volumes:
      - tripchord-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripchord"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      TRIPCHORD_ENV: production
      TRIPCHORD_DATABASE_URL: postgresql+asyncpg://tripchord:tripchord@postgres:5432/tripchord
      TRIPCHORD_REDIS_URL: redis://redis:6379/0
      TRIPCHORD_CORS_ORIGINS: '["http://localhost:8080"]'
      TRIPCHORD_AUTH_REQUIRED: "true"
      TRIPCHORD_AUTH_TOKENS: '${TRIPCHORD_AUTH_TOKENS:-{}}'
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  tripchord-postgres:
