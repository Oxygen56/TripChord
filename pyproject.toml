[project]
name = "tripchord"
version = "0.1.0"
description = "Grounded, constraint-checked leisure travel planning"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
keywords = ["agent", "travel", "planning", "rag", "fastapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.115.0",
  "httpx[socks]>=0.28.0",
  "orjson>=3.10.0",
  "ortools>=9.12.0",
  "aiosqlite>=0.21.0",
  "alembic>=1.16.0",
  "asyncpg>=0.30.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "python-multipart>=0.0.20",
  "redis>=6.0.0",
  "sqlalchemy[asyncio]>=2.0.40",
  "uvicorn[standard]>=0.34.0",
  "cryptography>=44.0",
]

[project.urls]
Homepage = "https://github.com/Oxygen56/TripChord"
Repository = "https://github.com/Oxygen56/TripChord"
Issues = "https://github.com/Oxygen56/TripChord/issues"


[project.optional-dependencies]
training = [
  "accelerate>=1.10.0",
  "datasets>=4.0.0",
  "peft>=0.17.0",
  "transformers>=5.0.0",
  "trl>=0.29.0",
]

[dependency-groups]
dev = [
  "hatchling==1.32.0",
  "mypy>=1.15.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/tripchord"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "benchmarks/tests"]
pythonpath = [".", "apps/api/src"]
addopts = "-q"
markers = ["integration: requires an external service such as PostgreSQL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["tripchord"]
mypy_path = "apps/api/src"
plugins = ["pydantic.mypy"]
